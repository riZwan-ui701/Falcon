title: Connect Conduit
tooltip: >-
  Draw New Conduit: click the exit point on one element, then a second
  element - 90-degree legs at that height, then a drop onto it. Connect
  Conduit: select conduits (Finish), then a device or panel - each conduit
  runs on along its own line and goes up/down into it; into a panel it drops
  straight to the middle of the top. Repeats until Esc. Falcon.
author: Rizwan Zahid
