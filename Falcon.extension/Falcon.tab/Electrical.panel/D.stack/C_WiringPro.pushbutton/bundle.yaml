title: Wiring Pro
tooltip: >-
  Wire ceiling or wall outlets in a plan: box-select them, click the first
  (and optionally the last) outlet. Clean horizontal/vertical lines in the
  shortest order, side middle to side middle, never over another fixture;
  optional circuit on a panel (with panel schedule), arc home-run wire and
  circuit tag. Line style or R/Y/B phase colors. Falcon.
author: Rizwan Zahid
