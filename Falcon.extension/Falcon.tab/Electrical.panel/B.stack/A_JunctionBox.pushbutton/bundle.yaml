title: Junction Box
tooltip: >-
  Type the elevation, select fixtures, Finish. At each fixture the routing
  lines (detail/model lines, wires, CAD) decide the box type - Terminal,
  Through, Angle, Tee, Branch_Y or Cross - and its rotation; a box already
  there is updated. Shift+click: click conduits to place boxes on them.
  Falcon.
author: Rizwan Zahid
